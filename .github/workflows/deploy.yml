name: Deploy Hosmedai

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/hosmedai
            mkdir -p /var/backups/hosmedai
            git diff > /var/backups/hosmedai/pre-deploy.patch || true
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.svg' \) -exec gzip -9 -k -f {} \;
            pm2 restart hosmedai --update-env
            nginx -t
            systemctl reload nginx
