# Included inside the hosmedai.com server block by the deployment workflow.
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2)$ {
    root /var/www/hosmedai/dist;
    try_files $uri @hosmedai_app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location @hosmedai_app {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
